<div class="arch-diagram">
<style>
.arch-diagram {
  margin: 1.5em 0;
  overflow-x: auto;
  border: 1px solid #e5e7eb;
  padding: 12px;
  background: #fafafa;
}
.arch-diagram svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  margin: 0 auto;
}
.arch-diagram .box-title {
  font-family: monospace;
  font-size: 13px;
  font-weight: 600;
  fill: #1f2937;
}
.arch-diagram .box-sub {
  font-family: monospace;
  font-size: 10px;
  fill: #6b7280;
}
.arch-diagram .lane { stroke-width: 1; }
.arch-diagram .lane-gray { fill: #f3f4f6; stroke: #9ca3af; }
.arch-diagram .lane-purple { fill: #ede9fe; stroke: #7c3aed; }
.arch-diagram .lane-amber { fill: #fef3c7; stroke: #d97706; }
.arch-diagram .lane-blue { fill: #dbeafe; stroke: #3b82f6; }
.arch-diagram .lane-teal { fill: #ccfbf1; stroke: #14b8a6; }
.arch-diagram .lane-green { fill: #dcfce7; stroke: #22c55e; }
.arch-diagram .flow-line {
  stroke: #6b7280;
  stroke-width: 1.2;
  fill: none;
}
</style>
<svg viewBox="0 0 480 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Orchestrator internals (simplified)</title>
  <defs>
    <marker id="orch-arrow" viewBox="0 0 10 10" refX="8" refY="5"

      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280"
        stroke-width="1.2" stroke-linecap="round"/>
    </marker>

  <text class="box-title" x="240" y="22" text-anchor="middle">
    Orchestrator internals
  </text>

  <text class="box-sub" x="240" y="72" text-anchor="middle">Natural language goal from user</text>

  <rect class="lane lane-amber" x="60" y="100" width="360" height="48" rx="8"/>
  <text class="box-title" x="240" y="122" text-anchor="middle">1. Task planner</text>
  <text class="box-sub" x="240" y="136" text-anchor="middle">Decompose goal, build DAG, prioritise</text>

  <rect class="lane lane-blue" x="60" y="164" width="360" height="48" rx="8"/>

  <text class="box-sub" x="240" y="200" text-anchor="middle">Match skills, dispatch serial or parallel</text>

  <line class="flow-line" x1="240" y1="212" x2="240" y2="228" marker-end="url(#orch-arrow)"/>

  <text class="box-sub" x="240" y="264" text-anchor="middle">Track steps, retries, resume after crash</text>

  <rect class="lane lane-green" x="60" y="292" width="360" height="48" rx="8"/>
  <text class="box-title" x="240" y="314" text-anchor="middle">4. Context manager</text>
  <text class="box-sub" x="240" y="328" text-anchor="middle">Prune history, pass prior results to agents</text>

  <line class="flow-line" x1="240" y1="340" x2="240" y2="356" marker-end="url(#orch-arrow)"/>

  <rect class="lane lane-purple" x="60" y="356" width="360" height="48" rx="8"/>
  <text class="box-title" x="240" y="378" text-anchor="middle">Sub-agents</text>
  <text class="box-sub" x="240" y="392" text-anchor="middle">Research, code, analysis, custom workers</text>

</div>
