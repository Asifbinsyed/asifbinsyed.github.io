<div class="arch-diagram">
<style>
.arch-diagram {
  margin: 1.5em 0;
  overflow-x: auto;
  border: 1px solid #e5e7eb;
  padding: 12px;
  background: #fafafa;
}
.arch-diagram svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  margin: 0 auto;
}
.arch-diagram .box-title {
  font-family: monospace;
  font-size: 13px;
  font-weight: 600;
  fill: #1f2937;
}
.arch-diagram .box-sub {
  font-family: monospace;
  font-size: 10px;

}
.arch-diagram .lane { stroke-width: 1; }
.arch-diagram .lane-gray { fill: #f3f4f6; stroke: #9ca3af; }

.arch-diagram .lane-teal { fill: #ccfbf1; stroke: #14b8a6; }
.arch-diagram .flow-line {

  stroke-width: 1.2;
  fill: none;
}
</style>
<svg viewBox="0 0 480 680" xmlns="http://www.w3.org/2000/svg" role="img">

  <text class="box-sub" x="240" y="464" text-anchor="middle">What / Where / Why</text>
