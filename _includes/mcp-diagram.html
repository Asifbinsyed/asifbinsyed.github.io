<div class="arch-diagram">
<style>
.arch-diagram {
  margin: 1.5em 0;
  overflow-x: auto;
  border: 1px solid #e5e7eb;
  padding: 12px;
  background: #fafafa;
}
.arch-diagram svg {
  display: block;
  width: 100%;
  max-width: 480px;
  height: auto;
  margin: 0 auto;
}
.arch-diagram .box-title {
  font-family: monospace;
  font-size: 13px;
  font-weight: 600;
  fill: #1f2937;
}
.arch-diagram .box-sub {
  font-family: monospace;
  font-size: 10px;
  fill: #6b7280;
}
.arch-diagram .lane { stroke-width: 1; }
.arch-diagram .lane-amber { fill: #fef3c7; stroke: #d97706; }
.arch-diagram .lane-teal { fill: #ccfbf1; stroke: #14b8a6; }

.arch-diagram .lane-green { fill: #dcfce7; stroke: #22c55e; }
.arch-diagram .flow-line {
  stroke: #6b7280;
  stroke-width: 1.2;
  fill: none;
}
.arch-diagram .fan-line {
  stroke: #9ca3af;
  stroke-width: 1;
  fill: none;
}
</style>

</div>
