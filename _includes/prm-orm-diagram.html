<div class="arch-diagram">
<style>
.arch-diagram {
  margin: 1.5em 0;
  overflow-x: auto;
  border: 1px solid #e5e7eb;
  padding: 12px;
  background: #fafafa;
}
.arch-diagram svg {
  display: block;
  width: 100%;
  max-width: 520px;
  height: auto;
  margin: 0 auto;
}
.arch-diagram .box-title {
  font-family: monospace;
  font-size: 12px;
  font-weight: 600;
  fill: #1f2937;
}
.arch-diagram .box-sub {
  font-family: monospace;
  font-size: 9px;
  fill: #6b7280;
}
.arch-diagram .lane { stroke-width: 1; }
.arch-diagram .lane-gray { fill: #f3f4f6; stroke: #9ca3af; }
.arch-diagram .lane-blue { fill: #dbeafe; stroke: #3b82f6; }
.arch-diagram .lane-amber { fill: #fef3c7; stroke: #d97706; }
.arch-diagram .lane-green { fill: #dcfce7; stroke: #22c55e; }
.arch-diagram .lane-purple { fill: #ede9fe; stroke: #7c3aed; }
.arch-diagram .flow-line {
  stroke: #6b7280;
  stroke-width: 1.2;
  fill: none;
}
.arch-diagram .label-side {
  font-family: monospace;
  font-size: 11px;
  font-weight: 600;
  fill: #374151;
}
</style>
<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ORM vs PRM: where the reward is applied</title>
  <defs>
    <marker id="prm-arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280"
        stroke-width="1.2" stroke-linecap="round"/>
    </marker>
  </defs>

  <text class="box-title" x="260" y="20" text-anchor="middle">
    Outcome RM (ORM) vs Process RM (PRM)
  </text>

  <!-- ORM column -->
  <text class="label-side" x="130" y="44" text-anchor="middle">ORM</text>
  <rect class="lane lane-gray" x="24" y="52" width="212" height="36" rx="6"/>
  <text class="box-title" x="130" y="70" text-anchor="middle">Question</text>
  <text class="box-sub" x="130" y="82" text-anchor="middle">GSM8K problem</text>

  <line class="flow-line" x1="130" y1="88" x2="130" y2="100" marker-end="url(#prm-arrow)"/>

  <rect class="lane lane-blue" x="24" y="100" width="212" height="72" rx="6"/>
  <text class="box-title" x="130" y="120" text-anchor="middle">Reasoning trace</text>
  <text class="box-sub" x="130" y="134" text-anchor="middle">step 1 ... step k</text>
  <text class="box-sub" x="130" y="148" text-anchor="middle">(no score per step)</text>
  <text class="box-sub" x="130" y="162" text-anchor="middle">final answer</text>

  <line class="flow-line" x1="130" y1="172" x2="130" y2="184" marker-end="url(#prm-arrow)"/>

  <rect class="lane lane-amber" x="24" y="184" width="212" height="40" rx="6"/>
  <text class="box-title" x="130" y="204" text-anchor="middle">ORM score once</text>
  <text class="box-sub" x="130" y="216" text-anchor="middle">correct / incorrect answer</text>

  <!-- PRM column -->
  <text class="label-side" x="390" y="44" text-anchor="middle">PRM</text>
  <rect class="lane lane-gray" x="284" y="52" width="212" height="36" rx="6"/>
  <text class="box-title" x="390" y="70" text-anchor="middle">Question</text>
  <text class="box-sub" x="390" y="82" text-anchor="middle">same problem</text>

  <line class="flow-line" x1="390" y1="88" x2="390" y2="100" marker-end="url(#prm-arrow)"/>

  <rect class="lane lane-blue" x="284" y="100" width="212" height="28" rx="6"/>
  <text class="box-title" x="390" y="118" text-anchor="middle">step 1</text>

  <line class="flow-line" x1="390" y1="128" x2="390" y2="138" marker-end="url(#prm-arrow)"/>
  <rect class="lane lane-green" x="284" y="138" width="212" height="24" rx="6"/>
  <text class="box-sub" x="390" y="154" text-anchor="middle">PRM: + / -</text>

  <line class="flow-line" x1="390" y1="162" x2="390" y2="172" marker-end="url(#prm-arrow)"/>
  <rect class="lane lane-blue" x="284" y="172" width="212" height="28" rx="6"/>
  <text class="box-title" x="390" y="190" text-anchor="middle">step 2 ... step k</text>

  <line class="flow-line" x1="390" y1="200" x2="390" y2="210" marker-end="url(#prm-arrow)"/>
  <rect class="lane lane-green" x="284" y="210" width="212" height="24" rx="6"/>
  <text class="box-sub" x="390" y="226" text-anchor="middle">PRM each step</text>

  <line class="flow-line" x1="390" y1="234" x2="390" y2="246" marker-end="url(#prm-arrow)"/>
  <rect class="lane lane-purple" x="284" y="246" width="212" height="36" rx="6"/>
  <text class="box-title" x="390" y="264" text-anchor="middle">Aggregate</text>
  <text class="box-sub" x="390" y="276" text-anchor="middle">min / product / search score</text>

  <!-- Uses row -->
  <text class="box-title" x="260" y="310" text-anchor="middle">Common uses</text>
  <rect class="lane lane-gray" x="40" y="322" width="440" height="88" rx="8"/>
  <text class="box-sub" x="260" y="342" text-anchor="middle">
    Best-of-N · beam / tree search · RL dense reward · early stop bad traces
  </text>
  <text class="box-sub" x="260" y="358" text-anchor="middle">
    ORM: cheap label, weak credit assignment
  </text>
  <text class="box-sub" x="260" y="374" text-anchor="middle">
    PRM: richer signal, harder labels
  </text>
  <text class="box-sub" x="260" y="390" text-anchor="middle">
    Modern reasoning models mix both + verifiers
  </text>
</svg>
</div>
